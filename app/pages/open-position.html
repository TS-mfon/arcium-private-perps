<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Open Private Position</title><link rel="icon" href="/app/favicon.svg" type="image/svg+xml"/><link rel="stylesheet" href="/app/site.css"/><script src="/app/wallet.js" defer></script></head><body><main class="shell"><header class="topbar"><a class="brand" href="/app"><span class="brand-mark">P</span><span>Open Position</span></a><nav class="nav-links"><a href="/app/how-it-works.html">How it works</a><a href="/app/pages/risk-check.html">Risk</a><a href="/app/pages/settle-pnl.html">Settle</a><button class="wallet-trigger" type="button" data-wallet-connect>Connect wallet</button></nav></header><section class="page-head"><p class="eyebrow">Function 01</p><h1>Open a private SOL/USDC position.</h1><p class="lede">Sensitive trade inputs stay out of the visible state. Wallet connection is required before submission.</p></section><section class="layout"><form class="panel form-grid" data-action-form="Open private position"><label>Market<select><option>SOL / USDC</option></select></label><label>Side<select><option>Long</option><option>Short</option></select></label><label>Size<input required type="number" min="0" step="0.01" placeholder="2.5 SOL"/></label><label>Collateral<input required type="number" min="0" step="0.01" placeholder="100 USDC"/></label><label>Leverage<input required type="number" min="1" max="10" step="0.1" placeholder="3"/></label><label>Slippage limit<input type="number" min="0" step="0.01" placeholder="0.5%"/></label><label class="wide">Trader wallet<output data-wallet-full>Connect a wallet to continue</output></label><div class="page-actions wide"><button class="action" type="submit" data-submit-action>Open position</button></div></form></section></main></body></html>
